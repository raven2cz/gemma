[pytest]
asyncio_mode = auto
testpaths = tests
timeout = 30
timeout_method = thread
markers =
    integration: testy proti reálné Ollamě (vyžadují běžící Ollama + model).
        Spuštění jen integračních: pytest -m integration
        Vynechání: pytest -m "not integration"
    claude_cli: E2E testy proti reálnému `claude` CLI subprocess (Claude Code).
        Vyžadují nainstalovaný `claude` v PATH + aktivní OAuth session
        (claude/login). Síťové volání = pomalé + spotřebovává Claude credity.
        Spuštění: pytest -m claude_cli
        Vynechání: pytest -m "not claude_cli"
