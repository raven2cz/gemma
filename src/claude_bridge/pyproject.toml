[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude_bridge"
version = "0.1.0"
description = "Adapter library for driving Claude Code CLI (print mode and tmux interactive mode)"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "raven2cz"}]
dependencies = []

[project.optional-dependencies]
tmux = ["pyte>=0.8"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "pytest-timeout>=2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_bridge*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
markers = [
    "claude_cli: E2E test against live `claude` CLI (requires installed binary + Max subscription auth)",
    "tmux_real: E2E test driving real tmux (requires `tmux` binary)",
]
